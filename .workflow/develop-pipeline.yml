version: '1.0'
name: develop-pipeline
displayName: 'CI-门禁（S1 静态/S2 单测为硬门禁，失败即阻断；S3 为 M1 占位，S4~S6 随里程碑接入。2026-09-26 OCR 评审修复：移除吞错回退）'
triggers:
  push:
    branches:
      include:
        - develop
        - master
  pull_request:
    branches:
      include:
        - develop
        - master
stages:
  - name: stage-quality
    displayName: 'S1 静态质量（lint+类型）'
    steps:
      - step: build@python
        name: lint_typecheck
        displayName: 'ruff + mypy'
        pythonVersion: 3.11
        commands:
          - python -m pip install --upgrade pip ruff mypy
          - ruff check services/ cli/ tests/
          # 仅 domain 参与硬门禁（本地 strict 全绿）；semantic/ 尚无 .py，待代码落地加入
          - mypy services/domain/ --strict
  - name: stage-unit
    displayName: 'S2 单元测试'
    steps:
      - step: build@python
        name: unit_tests
        displayName: 'pytest（domain 覆盖率 ≥90% 随 services/domain/tests 落地转硬门禁）'
        pythonVersion: 3.11
        commands:
          - python -m pip install -r requirements.txt pytest
          - pytest tests/ -v -m "not integration and not full and not e2e"
  - name: stage-integration
    displayName: 'S3 集成测试（lite 档，M1 前为占位）'
    steps:
      - step: build@python
        name: integration_tests
        displayName: 'testcontainers（PG/Redis/MinIO）'
        pythonVersion: 3.11
        commands:
          - echo "M1 接入：pytest -m integration（testcontainers PG/Redis/MinIO），届时替换本占位"
