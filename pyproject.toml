]

[[tool.mypy.overrides]]
# strict 区（domain/core）显式展开。2026-10-07 实证：mypy 2.3.1（锁内版本）下任一 override
# 带 strict=true 会把 strict 泄漏为全局（与 module 模式是否匹配无关），等效全仓 strict 致
# 2692 错；显式枚举恢复「domain/core strict、其余 normal」分级本意（docs/standards/01 §2.3）。
module = ["services.*.domain.*", "services.*.domain", "services.ontology.core.*", "services.ontology.core"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_decorators = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
warn_unused_ignores = true  # warn_redundant_casts 为全局旗标,per-module 不收(mypy 2.3 限制),让位于 strict 区其余旗标

[[tool.mypy.overrides]]
# 存量类型债豁免区（2026-09-27 首次全仓 mypy 暴露 105 处：ORM typed 风格/DTO 注解为主）。
# TODO(M3 偿还)：按模块逐步移出本豁免清单，最终只保留 strict 区。
module = [
    "services.*.data.*", "services.*.api.*", "services.*.business.*",
    "services.*.retrieval.*", "services.*.runtime.*",
    "services.platform.llm.*", "services.platform.deps",
    "services.gateway.*", "services.main",
]
ignore_errors = true

[[tool.mypy.overrides]]
# 02 §10 门2 豁免台账 2026-10-05（同 [tool.ruff] 登记）：97a9a7d 研究快照带入 + 8aa43d2
# tools 迁移外溢，挂债后清。
module = ["services.evals.*", "services.cron.*", "services.tools.*"]
ignore_errors = true

[[tool.importlinter.contracts]]
name = "agent 内核 import 白名单（02 §7 反腐化：仅 stdlib+pydantic+platform+agent.domain+内核自身）"
type = "forbidden"
source_modules = ["services.agent.business.kernel"]
forbidden_modules = [
    "fastapi", "sqlalchemy", "alembic", "httpx", "redis", "starlette",
    "services.gateway",
    "services.iam", "services.ontology", "services.kb", "services.review",
    "services.memory", "services.plugin", "services.mcp", "services.writeback",
    "services.rsi", "services.sandbox",
    "services.agent.api", "services.agent.data",
]
ignore_imports = [
    # platform.errors 的 starlette 统一错误体属底座实现细节（内核直接依赖=platform 本身，AST 白名单测试双保险）
    "services.agent.business.kernel.cancellation -> services.platform.errors",
    "services.agent.business.kernel.errors -> services.platform.errors",
    "services.agent.business.kernel.execution -> services.platform.errors",
    "services.agent.business.kernel.gate_baseline -> services.platform.errors",
    "services.agent.business.kernel.loop -> services.platform.errors",
    "services.agent.business.kernel.tool_dispatch -> services.platform.errors",  # B-① 并行段执行器同款接缝
    "services.agent.business.kernel.inbox -> services.platform.errors",  # M4.5-A inbox 容量码（4203）同款接缝
]

[[tool.importlinter.contracts]]
name = "模块内聚：memory.data 与 sandbox.data 模块私有"
type = "forbidden"
source_modules = ["services.gateway", "services.iam", "services.agent", "services.ontology", "services.kb", "services.review", "services.plugin", "services.mcp", "services.writeback", "services.rsi"]
forbidden_modules = ["services.memory.data", "services.sandbox.data"]
ignore_imports = [
    # memory 模块内装配面（api/business → data 为模块内合法分层；跨模块消费仅经 memory.business.runtime 公开面）
    "services.gateway.app -> services.memory.api.memory",  # 挂载根边豁免（间接链经模块内分层属合法）
    "services.memory.api.memory -> services.memory.data.l1",
    "services.memory.api.memory -> services.memory.data.repo_impl.fact_repo",
    "services.memory.business.runtime -> services.memory.data.l1",
    "services.memory.business.runtime -> services.memory.data.repo_impl.fact_repo",
]

# ── 边界契约（2026-09-28，docs/Agent/07 §5-1：内核↛能力层 import 纪律）──
[[tool.importlinter.contracts]]
name = "内核零能力依赖（agent kernel 禁 import capabilities，07 边界契约 T1~T4）"
type = "forbidden"
source_modules = ["services.agent.business.kernel"]
forbidden_modules = ["services.agent.business.capabilities"]
