type = "forbidden"
source_modules = [
    "services.platform", "services.iam", "services.agent", "services.ontology",
    "services.kb", "services.review", "services.memory", "services.plugin",
    "services.mcp", "services.writeback", "services.rsi", "services.sandbox",
]
forbidden_modules = ["services.gateway"]

[[tool.importlinter.contracts]]
name = "gateway 只做装配：仅挂 <模块>.api 与 platform（组合根 config 注入为显式白名单）"
type = "forbidden"
source_modules = ["services.gateway"]
forbidden_modules = [
    "services.iam.data", "services.agent.data", "services.ontology.data",
    "services.kb.data", "services.review.data", "services.sandbox.data",
    "services.agent.domain", "services.ontology.domain", "services.kb.domain",
    "services.memory.domain", "services.sandbox.domain", "services.review.domain",
    "services.ontology.core", "services.ontology.business",
    "services.kb.business", "services.kb.retrieval",
    "services.memory.business", "services.sandbox.runtime",
]
ignore_imports = [
    # 遗留组合点：审计中间件直写 audit 表（TODO(M4) 审计落库收口为 review/audit 服务）
    "services.gateway.middlewares -> services.iam.data.orm",
    # 路由挂载边（gateway→<模块>.api 为契约许可面；其间接链经模块内部分层属合法，逐边豁免）
    "services.gateway.app -> services.iam.api.auth",
    "services.gateway.app -> services.agent.api.sessions",
    "services.gateway.app -> services.agent.api.agents",  # 2026-09-27 agents CRUD 批（挂载边同 sessions 先例）
    "services.gateway.app -> services.agent.api.tasks",
    "services.gateway.app -> services.kb.api.kb",
    "services.gateway.app -> services.ontology.api.ontology",
    "services.gateway.app -> services.memory.api.memory",  # 计划 3.3：memory 六端点挂载边（同上逐边豁免）
    # UoW 仓储装配组合点（契约一同款豁免；TODO(M4) 收口）
    "services.platform.db.uow -> services.agent.data.repo_impl.session_repo",
    "services.platform.db.uow -> services.agent.domain.repo.session_repo",
    "services.platform.db.uow -> services.agent.data.repo_impl.agent_repo",  # 2026-09-27 agents CRUD 批
    "services.platform.db.uow -> services.agent.domain.repo.agent_repo",
    "services.gateway.app -> services.agent.business.task_worker",  # 任务执行 worker 组合根装配（2026-09-27 批，mcp.bootstrap 单边豁免同款）
    "services.gateway.app -> services.agent.data.repo_impl.task_poller",  # 任务 worker 轮询器组合根装配（同上）
    "services.gateway.app -> services.agent.domain.model.task",  # RunRetryPolicy 组合根注入（同上）
    # 候选审核端口组合点（契约六同款豁免；TODO(M4) 收口）
    "services.gateway.app -> services.review.business.candidates",
    # 4.2 组合根收口装配边（lifespan 装配，TODO(M4) UoW 收口一并复核）
    "services.gateway.app -> services.agent.business.capabilities.fs",  # 能力层 P0（docs/Agent/06）
    "services.gateway.app -> services.agent.business.capabilities.web",
    "services.gateway.app -> services.ontology.data.repo_impl.ontology_repo",  # 本体制品装载器绑定
    # P1-1 收口（2026-09-27 M4 验收条件一）：MCP registry 共享工厂（services/mcp/bootstrap）
    # ——gateway 与独立进程同一装配面；原 kb.business/iam.data/mcp.providers 三条直连边
    # 随装配逻辑移入 bootstrap 撤销，传递链组合点由本条单边豁免收口
    "services.gateway.app -> services.mcp.bootstrap",
]

