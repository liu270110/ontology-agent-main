# Alembic (authority: arch 06 migration discipline + database/01).
# Usage: alembic -c services/alembic.ini <cmd> (cwd=repo root). Keep this file
# ASCII-only: alembic reads it via configparser under the OS locale encoding
# (GBK on zh-CN Windows chokes on UTF-8 Chinese comments).
# script_location anchors on %(here)s = this file's directory, so the ini works
# from any cwd as long as -c points at it.
[alembic]
script_location = %(here)s/platform/db/migrations
# real URL assembled from OA_* env in env.py (services/platform/config.py)
sqlalchemy.url = driver://user:pass@localhost/dbname
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %%(levelname)-5.5s [%%(name)s] %%(message)s
datefmt = %%H:%%M:%%S
