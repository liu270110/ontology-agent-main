# 依赖与工具链唯一事实源（08 §8.1）；requirements.txt 保留为薄导出（CI 用）
[project]
name = "ontology-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0", "alembic>=1.13",
  "psycopg[binary]>=3.1", "pydantic>=2.7", "pydantic-settings>=2.2", "redis>=5",
]
[dependency-groups]
dev = ["pytest>=7.0", "ruff>=0.6", "mypy>=1.10", "fakeredis>=2.23", "pytest-asyncio>=0.23"]
[tool.ruff]
line-length = 120
extend-exclude = ["services/data/migrations/versions"]  # autogenerated
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
  "integration: 集成用例（testcontainers PG/Redis/MinIO，CI-S3）",
  "full: 依赖 full 档五存储（Neo4j/Milvus），仅 nightly",
  "e2e: 全栈端到端（Playwright，M3+）",
]
