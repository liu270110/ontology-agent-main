# deploy/docker-compose.full.yml —— full / full-cad 档全栈骨架（docs/ops/04 §3.2，批次 A）
# 在存储栈（deploy/docker-compose.yml，PG/Redis/MinIO，含 local overlay 的 minio-init 幂等建桶）
# 之上追加 api 服务（uvicorn，挂载 services + 前端预构建 dist——零 npm 原则，§2）；
# frontend（nginx 静态）为可选服务，走网关直挂时不需要，保持注释态按需解开。
# ⚠ full 档增量存储（Neo4j/Milvus 容器）随批次补齐（deploy/README 部署分档表口径），
#   当期以 PG 递归 CTE / pgvector 降级路径运行，行为契约两档一致。
#
# 用法（与 oadm up --profile full|full-cad 同源命令面）：
#   docker compose \
#     -f deploy/docker-compose.yml -f deploy/docker-compose.local.yml -f deploy/docker-compose.full.yml \
#     --profile full --env-file .env up -d --remove-orphans
#   # full-cad 档：--profile full-cad（差异=外置 CAD 通道经连接器/MCP 装配，不在本文件新增服务）
# 停栈：同 -f 组合 down（保卷）；oadm down --volumes 删卷（显式确认，§5）。

name: onto-agent

services:
  api:
    # compose profiles：--profile full / full-cad 时激活；lite 档 up 不带 --profile 则自动跳过
    profiles: ["full", "full-cad"]
    image: python:3.11-slim
    working_dir: /app
    environment:
      # 网内端点固定指向 compose 服务名；其余 OA_* 经 --env-file .env 注入（env 变量优先于 .env 文件）
      OA_DEPLOY_PROFILE: ${OA_DEPLOY_PROFILE:-full}
      OA_PG_HOST: postgres
      OA_PG_PORT: "5432"
      OA_PG_USER: ${OA_PG_USER:-onto}
      OA_PG_PASSWORD: ${OA_PG_PASSWORD:-onto_dev}
      OA_PG_DB: ${OA_PG_DB:-onto}
      OA_REDIS_URL: redis://redis:6379/0
      OA_MINIO_ENDPOINT: minio:9000
      OA_MINIO_USER: ${OA_MINIO_USER:-onto}
      OA_MINIO_PASSWORD: ${OA_MINIO_PASSWORD:-onto_dev}
      OA_JWT_SECRET: ${OA_JWT_SECRET:-dev-only-change-me}   # 【改我】生产经密钥管理下发
      # 模型/嵌入端点从 .env 透传：容器内访问宿主服务需 host.docker.internal（Windows/macOS）
      OA_LLM_BASE_URL: ${OA_LLM_BASE_URL:-}
      OA_LLM_API_KEY: ${OA_LLM_API_KEY:-}
      OA_LLM_MODEL: ${OA_LLM_MODEL:-deepseek-chat}
      OA_OLLAMA_BASE_URL: ${OA_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OA_EMBED_PROTOCOL: ${OA_EMBED_PROTOCOL:-ollama}
      OA_TASK_WORKER_ENABLED: ${OA_TASK_WORKER_ENABLED:-true}
    volumes:
      # 零构建薄壳：源码与锁文件直挂（开发/演示口径；生产镜像化随批次 B 流水线版本包，ops/04 §2）
      - ../services:/app/services:ro
      - ../pyproject.toml:/app/pyproject.toml:ro
      - ../uv.lock:/app/uv.lock:ro
      # 前端预构建产物（发布包自带，ops/04 §2 零 npm）；网关静态挂载接线随批次 C
      - ../frontend/dist:/app/frontend/dist:ro
    command: >
      sh -c "pip install --no-cache-dir uv &&
             uv sync --frozen &&
             uv run uvicorn services.gateway.app:create_app --factory --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/healthz', timeout=5)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # ── frontend（可选，ops/04 §3.2：nginx 静态+反代网关；走网关直挂时保持注释态）──
  # frontend:
  #   image: nginx:alpine
  #   profiles: ["full", "full-cad"]
  #   volumes:
  #     - ../frontend/dist:/usr/share/nginx/html:ro
  #     - ./nginx-frontend.conf:/etc/nginx/conf.d/default.conf:ro   # 反代 /api 与 /api/v1 到 api:8000
  #   ports:
  #     - "8080:80"
  #   depends_on:
  #     - api
