    "services.platform.db.uow -> services.agent.domain.repo.agent_repo",
    "services.platform.db.registry -> services.agent.data.orm",
    "services.platform.db.registry -> services.iam.data.orm",
    "services.platform.db.registry -> services.kb.data.orm",
    "services.platform.db.registry -> services.kb.data.connector_orm",
