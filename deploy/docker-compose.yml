# M0 · lite 档（默认）：PG + Redis + MinIO（对齐 docs/ops/01 与 deploy/README；full 档见 docker-compose.full.yml，M2 随语义层交付）
name: onto-agent

services:
  postgres:
    image: pgvector/pgvector:pg16  # 2026-09-27 已换（daocloud 镜像通道拉取，pg_data 卷数据保留）
    environment:
      POSTGRES_USER: ${OA_PG_USER:-onto}
      POSTGRES_PASSWORD: ${OA_PG_PASSWORD:-onto_dev}
      POSTGRES_DB: ${OA_PG_DB:-onto}
    ports: ["5432:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-pg:/docker-entrypoint-initdb.d:ro   # 只建扩展/权限；角色种子唯一走 Alembic 数据迁移（08 §2.2）
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OA_PG_USER:-onto} -d ${OA_PG_DB:-onto}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OA_MINIO_USER:-onto}
      MINIO_ROOT_PASSWORD: ${OA_MINIO_PASSWORD:-onto_dev}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pg_data:
  redis_data:
  minio_data:
