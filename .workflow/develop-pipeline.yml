version: '1.0'
name: develop-pipeline
displayName: 'CI-门禁（S1 静态/S2 单测硬门禁；S3 集成占位；S4 前端 build+vitest 硬门禁+视口矩阵软门禁。2026-09-28 接入 30 篇 §7.3）'
triggers:
  push:
    branches:
      include:
        - develop
        - master
  pull_request:
    branches:
      include:
        - develop
        - master
stages:
  - name: stage-quality
    displayName: 'S1 静态质量（ruff；mypy strict 待模块轴落位重建）'
    steps:
      - step: build@python
        name: lint_typecheck
        displayName: 'ruff lint'
        pythonVersion: 3.11
        commands:
          - python -m pip install --upgrade pip ruff
          - ruff check services/ tests/
          # mypy --strict 硬门禁待重建：原 services/domain/ 聚合目录随模块轴落位
          # （services/<模块>/domain）不再存在，新门禁对象属门禁设计决策，不在路径清账范围
  - name: stage-unit
    displayName: 'S2 单元测试'
    steps:
      - step: build@python
        name: unit_tests
        displayName: 'pytest（单测硬门禁；覆盖率门禁随模块轴落位待建）'
        pythonVersion: 3.11
        commands:
          - python -m pip install -r requirements.txt pytest
          - pytest tests/ -v -m "not integration and not full and not e2e"
  - name: stage-integration
    displayName: 'S3 集成测试（lite 档，M1 前为占位）'
    steps:
      - step: build@python
        name: integration_tests
        displayName: 'testcontainers（PG/Redis/MinIO）'
        pythonVersion: 3.11
        commands:
          - echo "M1 接入：pytest -m integration（testcontainers PG/Redis/MinIO），届时替换本占位"
  - name: stage-frontend
    displayName: 'S4 前端门禁（build+vitest+视口矩阵，30 篇 §7.3）'
    steps:
      - step: build@nodejs
        name: frontend_build_test
        displayName: 'frontend：tsc+vite build+vitest（Node 20）'
        nodeVersion: 20
        commands:
          - cd frontend
          - npm ci
          - npm run build
          - npx vitest run
      - step: build@nodejs
        name: frontend_viewport_matrix
        displayName: '视口矩阵（5 视口×亮暗×3 页，22 篇 §4）'
        nodeVersion: 20
        commands:
          - cd frontend
          - VITE_ENABLE_MOCK=1 npm run build
          - npm i -D playwright 2>/dev/null || true
          - npx playwright install chromium --with-deps || npx playwright install chromium
          - VITE_ENABLE_MOCK=1 npx vite preview --port 4199 & sleep 5
          - python tests/viewport-matrix.py || echo "WARN 视口矩阵非硬门禁（截图产物见构建 Artifacts）"
