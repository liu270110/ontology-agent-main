# 依赖与工具链唯一事实源（08 §8.1）；requirements.txt 保留为薄导出（CI 用）
[project]
name = "ontology-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42",
    "fastmcp>=2.12.5,<3",  # 4.x 需 starlette>=1.0 与 fastapi starlette<0.51 冲突——禁解锁
    "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy[asyncio]>=2.0", "alembic>=1.13",  # asyncio extra 拉 greenlet（异步引擎缺它起不来，2026-10-03 实测）
  "psycopg[binary]>=3.1", "docker>=7.1", "pydantic>=2.7", "pydantic-settings>=2.2", "redis>=5,<6",  # <6 上限随 arq 元数据（redis[hiredis]<6,>=4.2.0）显式落本文件，防 redis 隐式越界（ocr 16f32b1b）
  "arq>=0.28,<1",  # memory 域分布式任务队列（services/memory/business/tasks.py；<1 防 0.x 小版本隐式破坏 WorkerSettings API，ocr 142e4219）
  "pyjwt>=2.8",  # M1 网关 JWT 签发/校验（08 §2.1 claims；HS256 起，RS256/JWKS 随 M3）
  # 2026-09-27 工程 P2：UUIDv7 选型 = uuid-utils（Rust 实现，compat 子模块返回标准 uuid.UUID）；
  # PyPI `uuid7` 包无 compat 兼容层且维护弱，故不选（标注于 services/data/orm/base.py）
  "uuid-utils>=0.12",
  # M2 语义层（本体核心 ontology_core；docs/ontology 本体核心设计 §5 推理引擎表）
  "rdflib>=7",     # TBox 制品装载/序列化（Turtle）+ SPARQL ASK
  "pyshacl>=0.26",  # 引擎 2 约束验证（门禁语义：失败即拒绝）
  # M2 知识库批次（D）：httpx（Ollama embeddings 客户端，semantic/knowledge/embed）+
  # pgvector（document_chunks.embedding vector(1024) 列类型；迁移 add_kb_vector_embedding）
  "httpx>=0.27", "pgvector>=0.3",
  # kb 文件直传通道（v1.5 wedge，feature/kb-file-parse）：minio SDK（Apache-2.0，对象存储
  # 薄封装 services/platform/db/clients/minio_client.py；gateway/health.py 此前按可选依赖
  # 懒加载，依赖进册后 readyz minio 探活自动启用）；python-multipart 为 FastAPI
  # multipart/form-data（UploadFile/Form）解析后端，此前仅作 fastmcp 传递依赖在锁内，现
  # 升显式主依赖（路由面直接依赖必须显式声明）。
  "minio>=7.2", "python-multipart>=0.0.9",
  # kb 解析引擎链（v1.5 wedge，feature/kb-file-parse）：pypdfium2 = 默认 PDF 引擎
  # （OA_KB_PARSER=pdfium）——零模型、确定性、纯文本层直抽，故入主依赖；docling（可选
  # 重模型引擎）与 pdfplumber（兜底引擎）均懒加载可选，不进主依赖与 uv.lock（缺库自动
  # 降级 pdfium 并登记 meta.degraded=["parser"]，见 services/kb/business/parsers.py）。
  "pypdfium2>=4",
]
[dependency-groups]
dev = ["pytest>=7.0", "ruff>=0.6", "mypy>=1.10", "fakeredis>=2.23", "pytest-asyncio>=0.23", "httpx>=0.27", "import-linter>=2.15"]  # import 契约门禁 CLI（lint-imports）；此前仅主仓 venv 手装未声明，新 worktree uv sync 后缺工具（M4.6-D1）
[tool.ruff]
line-length = 120
# 02 §10 门2 豁免台账 2026-10-05:97a9a7d 研究快照带入,挂债后清(豁免区仅限下列四处,不得扩大;
# services/devtools 验收靶不豁免;mypy 同款登记见 [tool.mypy] exclude 注释)
extend-exclude = [
  "services/platform/db/migrations/versions",  # autogenerated
  "services/evals",    # 97a9a7d 研究快照(≈1900 lint/≈1800 mypy/169 format)
  "services/cron",     # 97a9a7d 研究快照(≈505 mypy/55 format)
  "services/tools",    # 8aa43d2 tools→services/tools 迁移带入(44 lint/15 format/96 mypy)
  "resrch-pj",         # 97a9a7d 研究快照(仓库根,非 services/tests 门禁路径,登记防误扫)
]
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: 集成用例（testcontainers PG/Redis/MinIO，CI-S3）",
  "full: 依赖 full 档五存储（Neo4j/Milvus），仅 nightly",
  "e2e: 全栈端到端（Playwright，M3+）",
  "ollama: Ollama 真机冒烟（本机 11434；无服务自动 skip）",
  "vllm: 本机 vLLM 栈实测（127.0.0.1:18001 /v1；无服务自动 skip）",
]

[tool.importlinter]
root_packages = ["services"]
include_external_packages = true

